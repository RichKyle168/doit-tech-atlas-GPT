ter;box-shadow:0 10px 50px rgba(0,0,0,.28),0 0 36px rgba(91,216,255,.07);transition:.25s}.start-btn:hover{transform:translateY(-2px);border-color:rgba(155,239,255,.58);box-shadow:0 12px 54px rgba(0,0,0,.32),0 0 42px rgba(91,216,255,.12)}.start-btn span{font-size:14px;font-weight:650;letter-spacing:.08em}.start-btn b{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:rgba(155,239,255,.11);color:#c9f7ff}.opening-foot{margin-top:26px;color:#53687d;font-size:8px;letter-spacing:.28em}

.stage.focus-mode .node{
  opacity:.22 !important;

  filter:blur(0) brightness(1.15) !important;
  z-index:450 !important;
}

  transform:translateY(-2px) scale(1.03);

.node .label{
  transition:transform .22s ease, opacity .22s ease;
}

function prettyNodeLabel(text){
  if(!text) return "";
  if(text.length < 7) return text;

  const markers = ["與","及","暨","和","／","&"];
  for(const m of markers){
    const idx = text.indexOf(m);
    if(idx >= 3 && idx <= text.length - 3){
      return `<span class="label-line">${text.slice(0,idx)}</span><span class="label-line">${text.slice(idx)}</span>`;
    }
  }

  // Balanced fallback while preserving maximum two lines.
  let cut = Math.ceil(text.length / 2);
  if(cut < 3) cut = 3;
  return `<span class="label-line">${text.slice(0,cut)}</span><span class="label-line">${text.slice(cut)}</span>`;
}

  }
  orbitNodes.forEach(n=>{n.a+=n.v*hoverSlow;const orbitY=innerWidth<=620?.38:innerWidth<=900?.46:.55;const x=cx+Math.cos(n.a)*n.r,y=cy+Math.sin(n.a)*n.r*orbitY,d=(Math.sin(n.a+n.p)+1)/2,z=-90+d*185,sc=(state.level==="star"?.8:.76)+d*(state.level==="star"?.34:.42);n.el.style.left=x+"px";n.el.style.top=y+"px";n.el.style.transform=`translate(-50%,-50%) translateZ(${z}px) scale(${sc})`;n.el.style.opacity=(.42+d*.58).toFixed(3);n.el.style.zIndex=String(30+Math.round(d*220));n.el.style.filter=`blur(${(1-d)*1.05}px)`});requestAnimationFrame(animate)}
const canvas=$("#space"),ctx=canvas.getContext("2d");let W,H,stars,dust,near;function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:310},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random(),r:Math.random()*1.2+.12,a:Math.random()*.68+.1}));dust=Array.from({length:1100},()=>({x:Math.random()*W,y:H*.08+Math.random()*H*.25+(Math.random()-.5)*80,r:Math.random()*1.15+.13,a:Math.random()*.15+.015}));near=Array.from({length:65},()=>({x:Math.random()*W,y:Math.random()*H,z:.7+Math.random()*.3,r:Math.random()*1.9+.35,a:Math.random()*.30+.07}))}function draw(){warp+=(targetWarp-warp)*.06;ctx.clearRect(0,0,W,H);dust.forEach(d=>{ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,244,224,${d.a*(1-warp*.7)})`;ctx.fill()});const cx=W*.6,cy=H*.56;stars.forEach(s=>{if(warp>.02){const dx=s.x-cx,dy=s.y-cy,l=Math.max(1,Math.hypot(dx,dy)),p=warp*(11+s.z*48);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+dx/l*p,s.y+dy/l*p);ctx.strokeStyle=`rgba(195,229,255,${s.a*(.25+warp*.9)})`;ctx.lineWidth=.5+s.z*1.1;ctx.stroke()}else{ctx.beginPath();ctx.arc(s.x+mx*6*s.z,s.y+my*4*s.z,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(185,222,255,${s.a})`;ctx.fill()}});near.forEach(f=>{ctx.beginPath();ctx.arc(f.x+mx*12*f.z,f.y+my*8*f.z,f.r,0,Math.PI*2);ctx.fillStyle=`rgba(218,240,255,${f.a*(1-warp*.4)})`;ctx.fill()});requestAnimationFrame(draw)}

const viewportEl=document.querySelector(".viewport");

viewportEl.addEventListener("pointerdown",e=>{
  if(e.button!==undefined && e.button!==0) return;
  if(e.target.closest(".stellar-sheet") || e.target.closest(".topbar") || e.target.closest(".drt")) return;

  // Important: do NOT capture the pointer yet.
  // A normal click on a planet/star must remain a real button click.
  dragPending=true;
  dragActive=false;
  dragPointerId=e.pointerId;
  dragStartX=dragLastX=e.clientX;
  dragLastT=performance.now();
  dragTravel=0;
  orbitVelocity=0;
});

viewportEl.addEventListener("pointermove",e=>{
  if(!dragPending || e.pointerId!==dragPointerId) return;

  const totalDx=e.clientX-dragStartX;

  // Only convert the gesture into orbit dragging after an intentional move.
  // Before this threshold, the event belongs to the star/planet button,
  // so clicking still enters the next layer.
  if(!dragActive){
    if(Math.abs(totalDx)<6) return;

    dragActive=true;
    hoverSlow=0;
    document.querySelectorAll(".node.focused").forEach(n=>n.classList.remove("focused"));
    $("#stage").classList.remove("focus-mode");
    viewportEl.classList.add("dragging");

    try{ viewportEl.setPointerCapture(e.pointerId); }catch(_){}
  }

  const now=performance.now();
  const dx=e.clientX-dragLastX;
  const dt=Math.max(6,now-dragLastT);

  const directSensitivity = state.level==="universe" ? 0.0125 : 0.0115;
  const deltaAngle=-dx*directSensitivity;
  orbitNodes.forEach(n=>n.a += deltaAngle);

  const rawVelocity=-(dx/dt)*0.19;
  orbitVelocity=Math.max(-0.075,Math.min(0.075,rawVelocity));

  dragTravel+=Math.abs(dx);
  dragLastX=e.clientX;
  dragLastT=now;

  e.preventDefault();
});

function endOrbitDrag(e){
  if(!dragPending || e.pointerId!==dragPointerId) return;

  const wasDragging=dragActive;

  dragPending=false;
  dragActive=false;
  dragPointerId=null;
  hoverSlow=1;
  viewportEl.classList.remove("dragging");

  if(wasDragging){
    // Suppress only the synthetic click that can occur after a real drag.
    suppressClickUntil=Date.now()+280;
    try{ viewportEl.releasePointerCapture(e.pointerId); }catch(_){}
  }
  // If it was only a tap/click, we intentionally do nothing here:
  // the node's native click event is allowed to fire normally.
}

viewportEl.addEventListener("pointerup",endOrbitDrag);
viewportEl.addEventListener("pointercancel",endOrbitDrag);

window.onmousemove=e=>{
  mx=e.clientX/innerWidth-.5;
  my=e.clientY/innerHeight-.5;
  $("#camera").style.transform=`rotateX(${4-my*4}deg) rotateY(${mx*7}deg)`;
  const photo=document.querySelector(".photo");
  const shade=document.querySelector(".shade");
  photo.style.transform=`scale(1.018) translate(${mx*-8}px,${my*-5}px)`;
  shade.style.transform=`translate(${mx*3}px,${my*2}px)`;
};
window.onresize=()=>{resize();renderOrbit()};window.onkeydown=e=>{if(e.key==="Escape"){if($("#sheet").classList.contains("open"))closeSheet();else if(state.level!=="universe")back()}if(e.key==="Enter"&&!state.started)startExperience()};updateUI();renderOrbit();resize();draw();requestAnimationFrame(animate);
</script>
